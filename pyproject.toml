[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimension-coding-agent"
version = "0.1.0"
description = "Local coding agent with green git checkpoints"
requires-python = ">=3.11"

[project.scripts]
Dimension = "agent:main"

[tool.setuptools]
py-modules = ["agent", "terminal_ui", "project_check"]
